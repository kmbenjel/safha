[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "safha"
dynamic = ["version"]
description = "Lossless crop, deskew and split for scanned book PDFs: images are never re-encoded; one box per book; for phones and e-readers."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Khalid Benjelloun" }]
keywords = ["pdf", "scan", "crop", "deskew", "e-reader", "kindle", "kobo", "remarkable", "book", "lossless", "arabic", "rtl"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
  "Topic :: Text Processing",
]
dependencies = ["pymupdf>=1.24", "numpy>=1.24", "scipy>=1.10", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/kmbenjel/safha"
Documentation = "https://warraq.benjelloun.dev/safha/"
Issues = "https://github.com/kmbenjel/safha/issues"
Changelog = "https://github.com/kmbenjel/safha/blob/main/CHANGELOG.md"

[project.scripts]
safha = "safha.cli:main"

[tool.hatch.version]
path = "src/safha/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/safha"]

[tool.hatch.build.targets.sdist]
exclude = ["docs/media/*.gif", "bench/results", ".github"]

[tool.ruff]
line-length = 140
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E731", "E741", "SIM108", "RUF001", "RUF002", "RUF003", "B023", "SIM102", "RUF005", "RUF046", "B905", "UP031", "RUF007", "RUF059"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["safha"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
