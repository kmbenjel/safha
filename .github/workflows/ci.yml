name: CI
on:
  push:
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff check .
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get install -y fonts-dejavu-core
      - run: uv venv --clear && uv pip install -e ".[dev]"
      # --no-sync: test what `uv pip install` put in the environment (a project lock would resolve for every Python at
      # once and can pick a dependency with no wheel for the newest one)
      - run: uv run --no-sync pytest --cov=safha --cov-report=term --cov-report=xml
      - run: uv run --no-sync safha demo -o /tmp/demo
  lowest:
    # the oldest versions pyproject.toml allows, on the oldest Python: the floors are tested, not guessed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
      - run: sudo apt-get install -y fonts-dejavu-core
      - run: uv venv --clear && uv pip install --resolution lowest-direct -e ".[dev]"
      - run: uv run --no-sync pytest
